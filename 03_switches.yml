- name: Switches - VLAN, STP, trunk, access portar
  hosts: switches
  gather_facts: false
  tasks:
    - name: VLANs
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
        state: merged
      loop: "{{ client_vlans + [mgmt_vlan, native_vlan] }}"

    - name: Spanning tree mode
      cisco.ios.ios_config:
        lines:
          - spanning-tree mode {{ stp_mode }}

    - name: Trunk portar
      cisco.ios.ios_config:
        parents: interface {{ item }}
        lines:
          - switchport mode trunk
          - switchport trunk native vlan {{ native_vlan.id }}
          - switchport trunk allowed vlan {{ trunk_vlans }}
      loop: "{{ trunk_ports }}"

    - name: Access portar
      cisco.ios.ios_config:
        parents: interface {{ item.port }}
        lines:
          - switchport mode access
          - switchport access vlan {{ item.vlan }}
          - spanning-tree portfast
      loop: "{{ access_ports }}"

    - name: Porter oppe
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: true
        state: merged
      loop: "{{ trunk_ports + access_ports | map(attribute='port') | list }}"

    - name: Lagre
      cisco.ios.ios_config:
        save_when: modified
