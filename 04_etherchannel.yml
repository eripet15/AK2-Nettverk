- name: Etherchannel til nabostudent
  hosts: switches
  gather_facts: false
  tasks:
    - name: Member ports
      cisco.ios.ios_config:
        parents: interface {{ item }}
        lines:
          - switchport mode trunk
          - switchport trunk native vlan {{ native_vlan.id }}
          - switchport trunk allowed vlan {{ po_vlans }}
          - channel-group {{ etherchannel.id }} mode {{ etherchannel.mode }}
      loop: "{{ po_members }}"

    - name: Member ports oppe
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: true
        state: merged
      loop: "{{ po_members }}"

    - name: Port-channel interface
      cisco.ios.ios_config:
        parents: interface Port-channel{{ etherchannel.id }}
        lines:
          - switchport mode trunk
          - switchport trunk native vlan {{ native_vlan.id }}
          - switchport trunk allowed vlan {{ po_vlans }}
      when: po_members | length > 0

    - name: Lagre
      cisco.ios.ios_config:
        save_when: modified
